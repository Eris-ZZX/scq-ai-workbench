services:
  db:
    image: postgres:17@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-qe}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - qe_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qe} -d ${POSTGRES_DB:-qe}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin-change-me}
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - qe_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-qe}:${POSTGRES_PASSWORD:-dev-only-change-me}@db:5432/${POSTGRES_DB:-qe}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AUTHING_ISSUER: ${AUTHING_ISSUER:?AUTHING_ISSUER is required}
      AUTHING_CLIENT_ID: ${AUTHING_CLIENT_ID:?AUTHING_CLIENT_ID is required}
      AUTHING_CLIENT_SECRET: ${AUTHING_CLIENT_SECRET:?AUTHING_CLIENT_SECRET is required}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?ADMIN_INITIAL_PASSWORD is required for an empty database}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin-change-me}
      MINIO_BUCKET: ${MINIO_BUCKET:-qe-workbench}
    ports:
      - "${APP_HOST_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  dws-worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-qe}:${POSTGRES_PASSWORD:-dev-only-change-me}@db:5432/${POSTGRES_DB:-qe}
      APP_BASE_URL: ${APP_BASE_URL:-http://app:3000}
      # HOME 指向挂载卷，使 dws 的 ~/.dws 与 ~/.local/share/dws-cli 登录态持久化
      HOME: /run/dws
      DWS_CONFIG_DIR: /run/dws
      DWS_DISABLE_KEYCHAIN: "1"
      DWS_CLI_COMMAND: ${DWS_CLI_COMMAND:-dws}
      DWS_CLI_TIMEOUT_MS: ${DWS_CLI_TIMEOUT_MS:-30000}
      DWS_WORKER_ID: ${DWS_WORKER_ID:-dws-worker}
      DWS_WORKER_INTERVAL_MS: ${DWS_WORKER_INTERVAL_MS:-5000}
      DWS_MAX_ATTEMPTS: ${DWS_MAX_ATTEMPTS:-5}
      DWS_WORKER_ONCE: ${DWS_WORKER_ONCE:-false}
    volumes:
      - ${DWS_CONFIG_DIR:-/opt/qe-workbench-it/dws-config}:/run/dws

volumes:
  qe_pgdata:
  qe_minio:

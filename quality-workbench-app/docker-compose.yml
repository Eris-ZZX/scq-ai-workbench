# 本地开发 / Linux 生产共用
# 仅数据库: docker compose up -d db
# 应用+数据库: docker compose --profile app up -d --build
# 生产请在同目录 .env 设置强 POSTGRES_PASSWORD 与 JWT_SECRET
services:
  db:
    image: postgres:17
    container_name: qe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
      POSTGRES_DB: ${POSTGRES_DB:-qe}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - qe_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qe} -d ${POSTGRES_DB:-qe}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qe-app
    restart: unless-stopped
    # Force-clear Node image default entrypoint (/usr/local/bin/docker-entrypoint.sh)
    entrypoint: ["node", "scripts/start-with-db.mjs"]
    command: ["npm", "run", "start"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required for app}
      POSTGRES_USER: ${POSTGRES_USER:-qe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
      POSTGRES_DB: ${POSTGRES_DB:-qe}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # Local compose may use POSTGRES_PASSWORD=dev; set true only for non-prod trials
      ALLOW_DEV_POSTGRES_PASSWORD: ${ALLOW_DEV_POSTGRES_PASSWORD:-true}
      # Optional overrides / DingTalk
      DATABASE_URL: ${DATABASE_URL:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      DINGTALK_CLIENT_ID: ${DINGTALK_CLIENT_ID:-}
      DINGTALK_CLIENT_SECRET: ${DINGTALK_CLIENT_SECRET:-}
      DINGTALK_REDIRECT_URI: ${DINGTALK_REDIRECT_URI:-}
      DINGTALK_AGENT_ID: ${DINGTALK_AGENT_ID:-}
      RUN_SEED_ON_BOOT: ${RUN_SEED_ON_BOOT:-false}
    ports:
      - "3000:3000"
    volumes:
      - qe_ai_uploads:/app/storage/ai-resources

volumes:
  qe_pgdata:
  qe_ai_uploads:

# 本地开发 / Linux 生产共用的 PostgreSQL 服务
# 本地: docker compose up -d  (弱密码即可)
# 生产: 在同目录 .env 里设置强 POSTGRES_PASSWORD,再 docker compose up -d
# 端口只绑 127.0.0.1,不对外暴露;应用作为宿主机进程连 localhost:5432
services:
  db:
    image: postgres:16
    container_name: qe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
      POSTGRES_DB: ${POSTGRES_DB:-qe}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - qe_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qe} -d ${POSTGRES_DB:-qe}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  qe_pgdata:
